version: '3.8'

services:

  db-entries:
    image: postgres:16
    container_name: db-entries
    environment:
      POSTGRES_DB: db_entries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-entries-data:/var/lib/postgresql/data
    networks:
      - fluxo-caixa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-consolidation:
    image: postgres:16
    container_name: db-consolidation
    environment:
      POSTGRES_DB: db_consolidation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-consolidation-data:/var/lib/postgresql/data
    networks:
      - fluxo-caixa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - fluxo-caixa-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  entries-api:
    build:
      context: .
      dockerfile: src/Services/Entries/Entries.API/Dockerfile
    container_name: entries-api
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-entries;Port=5432;Database=db_entries;Username=postgres;Password=postgres
      - RabbitMq__HostName=rabbitmq
      - Jwt__Issuer=FluxoCaixa
      - Jwt__Audience=FluxoCaixa
      - Jwt__Secret=fluxo-caixa-secret-key-2026-super-secure
    depends_on:
      db-entries:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fluxo-caixa-network

  consolidation-api:
    build:
      context: .
      dockerfile: src/Services/Consolidation/Consolidation.API/Dockerfile
    container_name: consolidation-api
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-consolidation;Port=5432;Database=db_consolidation;Username=postgres;Password=postgres
      - RabbitMq__HostName=rabbitmq
      - Jwt__Issuer=FluxoCaixa
      - Jwt__Audience=FluxoCaixa
      - Jwt__Secret=fluxo-caixa-secret-key-2026-super-secure
    depends_on:
      db-consolidation:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fluxo-caixa-network

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Issuer=FluxoCaixa
      - Jwt__Audience=FluxoCaixa
      - Jwt__Secret=fluxo-caixa-secret-key-2026-super-secure
    depends_on:
      - entries-api
      - consolidation-api
    networks:
      - fluxo-caixa-network

networks:
  fluxo-caixa-network:
    driver: bridge

volumes:
  db-entries-data:
  db-consolidation-data: