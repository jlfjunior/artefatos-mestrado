# Sobe toda a infra e os dois serviços. Para apenas a infra (rodando as APIs
# localmente com dotnet run), use:  docker compose up postgres rabbitmq redis jaeger
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Cria os dois bancos no boot.
      POSTGRES_MULTIPLE_DATABASES: lancamentos,consolidado
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI (http://localhost:15672 - guest/guest)
    volumes:
      # Persiste filas e mensagens entre restarts do broker (durabilidade).
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Coletor OTLP + UI de tracing. Jaeger all-in-one aceita OTLP nativamente.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI (http://localhost:16686)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  lancamentos-api:
    build:
      context: .
      dockerfile: src/Lancamentos/Lancamentos.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=lancamentos;Username=postgres;Password=postgres"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Jwt__Key: "chave-de-desenvolvimento-troque-em-producao-please-32+chars"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  consolidado-api:
    build:
      context: .
      dockerfile: src/Consolidado/Consolidado.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=consolidado;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Jwt__Key: "chave-de-desenvolvimento-troque-em-producao-please-32+chars"
      Otlp__Endpoint: "http://jaeger:4317"
    ports:
      - "5090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  # SPA (React/Vite) servida por nginx. As URLs das APIs são assadas no build
  # apontando para as portas do host (5080/5090), alcançadas pelo browser.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - lancamentos-api
      - consolidado-api

volumes:
  pgdata:
  rabbitmq_data:
